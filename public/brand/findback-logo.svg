<svg width="220" height="120" viewBox="0 0 220 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="FindBack PH logo">
  <!-- Brand tile (mirrors src/components/logo.tsx LogoMark) -->
  <defs>
    <linearGradient id="tileBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EAF7F5"/>
    </linearGradient>
  </defs>
  <rect x="6" y="10" width="34" height="34" rx="11" fill="url(#tileBg)" stroke="#20948F" stroke-width="1.6"/>
  <!-- Philippine sun -->
  <g fill="none" stroke="#F59341" stroke-width="1.8" stroke-linecap="round">
    <path d="M23 13v2.6"/><path d="M23 30.4V33"/><path d="M6.6 23h2.6"/><path d="M36.8 23h2.6"/>
    <path d="M10.9 16.9l1.9 1.9"/><path d="M33.2 27.2l1.9 1.9"/><path d="M10.9 29.1l1.9-1.9"/><path d="M33.2 18.8l1.9-1.9"/>
  </g>
  <!-- Magnifying glass -->
  <g>
    <circle cx="23" cy="23" r="6.2" fill="none" stroke="#0F7B72" stroke-width="2.6"/>
    <circle cx="23" cy="23" r="6.2" fill="#FFFFFF" opacity="0.55"/>
    <path d="M28 28 L34 34" stroke="#0F7B72" stroke-width="3" stroke-linecap="round"/>
  </g>
  <!-- Wordmark: FindBack (espresso) + PH (brand teal) -->
  <text x="48" y="38" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#2E2417">
    FindBack
  </text>
  <text x="145" y="38" font-family="system-ui, sans-serif" font-size="22" font-weight="800" fill="#0F7B72">
    PH
  </text>
  <!-- Tagline -->
  <text x="48" y="60" font-family="system-ui, sans-serif" font-size="11" fill="#6B5636">
    Lost today. Found tomorrow.
  </text>
</svg>