name: Security & Quality

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Never let a workflow run with secrets echoed, and fail fast on env issues.
permissions:
  contents: read

jobs:
  # 1) Block accidental production-targeting debug/E2E configuration.
  #    E2E_ALLOWED must never be set in any committed environment file.
  env-guard:
    name: "Env guard (no E2E_ALLOWED / no secrets in config)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure no E2E_ALLOWED in committed env files
        run: |
          if grep -rn "E2E_ALLOWED" --include=".env*" --include="*.env" . 2>/dev/null; then
            echo "::error::E2E_ALLOWED must not be committed. Remove it from tracked env files."
            exit 1
          fi
          echo "OK: no E2E_ALLOWED in committed files"

  # 2) Detect accidentally committed secrets / service-role keys.
  secrets:
    name: "Secret scan"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan for likely secrets in tracked files
        run: |
          set +e
          # High-signal patterns only: real credential VALUES (JWTs, Stripe live
          # keys, Google API keys). Bare env-var *names* (e.g.
          # "process.env.SUPABASE_SERVICE_ROLE_KEY" in scripts or docs) are
          # legitimate code/documentation and would only produce false positives.
          HITS=$(grep -rEn \
            "(eyJhbGciOiJIUzI1Ni|sk_live_[a-zA-Z0-9]{24,}|AIza[0-9A-Za-z_-]{35}|-----BEGIN [A-Z ]*PRIVATE KEY-----)" \
            --include="*.ts" --include="*.tsx" --include="*.js" --include="*.mjs" \
            --include="*.json" --include="*.md" \
            --exclude-dir=node_modules --exclude-dir=.next --exclude="package-lock.json" \
            . 2>/dev/null || true)
          if [ -n "$HITS" ]; then
            echo "::error::Possible secret(s) found in tracked files:"
            echo "$HITS"
            exit 1
          fi
          echo "OK: no obvious secrets in tracked source"

  # 3) Typecheck / lint / build.
  build:
    name: "Typecheck, lint & build"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      # Placeholder Supabase creds: CI has no real env vars, and static
      # prerendering (e.g. /contact) instantiates a Supabase client at build
      # time, which throws without them. Values are dummies — never real keys —
      # and only exist inside this ephemeral CI job.
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key

  # 4) E2E production-targeting guard scenarios.
  #    TEMPORARILY DISABLED: this job ran `node scripts/_guard_scenarios.mjs`,
  #    but that file was never committed, so the job could never pass and kept
  #    every push red. Restore it (with the script) if the guard scenarios are
  #    ever recreated.
