# Weekly automated Supabase database backup.
#
# Supabase's free tier provides NO automated backups — if the database is ever
# corrupted or accidentally wiped, everything is gone. This workflow runs
# pg_dump every Sunday 01:00 UTC (9:00 AM PH time), compresses the dump, and
# stores it as a GitHub Actions artifact (retained 30 days).
#
# One-time setup (GitHub repo → Settings → Secrets and variables → Actions):
#   1. SUPABASE_DB_URL — the full Session Pooler connection string:
#      Supabase Dashboard → Connect → Session pooler, e.g.
#      postgresql://postgres.<project-ref>:<password>@aws-0-<region>.pooler.supabase.com:5432/postgres
#      (Use the pooler host, NOT db.<ref>.supabase.co — GitHub runners cannot
#      reach Supabase's direct IPv6-only database host.)
#   2. Add the same connection string to Supabase Auth's allowed list if you
#      restrict access (otherwise nothing else is needed).
#
# Restore drill (do this once before relying on it):
#   pg_restore or psql the downloaded dump into a scratch Supabase project.
#
# Note: this backs up the DATABASE only. Report photos live in Supabase
# Storage (findbackph Storage bucket) and are not included in pg_dump.

name: Weekly database backup

on:
  schedule:
    - cron: "0 1 * * 0" # every Sunday 01:00 UTC = 09:00 PH time
  workflow_dispatch: {} # allow manual runs to test the pipeline

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Dump database
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::SUPABASE_DB_URL secret is not set. See comments at the top of this file."
            exit 1
          fi
          pg_dump --version
          pg_dump \
            --no-owner \
            --no-privileges \
            --exclude-schema='^pg_*' \
            --format=custom \
            --file=findbackph-db.dump \
            "$SUPABASE_DB_URL"
          gzip -9 findbackph-db.dump
          ls -lh findbackph-db.dump.gz

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_id }}
          path: findbackph-db.dump.gz
          retention-days: 30
          if-no-files-found: error
