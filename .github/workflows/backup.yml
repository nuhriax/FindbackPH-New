# Weekly automated Supabase database backup.
#
# Supabase's free tier provides NO automated backups — if the database is ever
# corrupted or accidentally wiped, everything is gone. This workflow runs
# pg_dump every Sunday 01:00 UTC (9:00 AM PH time), compresses the dump, and
# stores it as a GitHub Actions artifact (retained 30 days).
#
# One-time setup (GitHub repo → Settings → Secrets and variables → Actions):
#   SUPABASE_DB_PASSWORD — ONLY the database password
#   (Supabase dashboard → Settings → Database → Reset database password to get
#   a known-good one). The host, username (postgres.<project-ref>), and
#   database name are hardcoded below because they are not secrets — passing a
#   full connection URL proved error-prone (wrong host / missing project ref
#   in the username caused repeated auth failures).
#
# Restore drill (do this once before relying on it):
#   pg_restore or psql the downloaded dump into a scratch Supabase project.
#
# Note: this backs up the DATABASE only. Report photos live in Supabase
# Storage and are not included in pg_dump.

name: Weekly database backup

on:
  schedule:
    - cron: "0 1 * * 0" # every Sunday 01:00 UTC = 09:00 PH time
  workflow_dispatch: {} # allow manual runs to test the pipeline

env:
  PGHOST: aws-0-ap-southeast-1.pooler.supabase.com
  PGPORT: "5432"
  PGDATABASE: postgres
  # Session pooler usernames MUST be "postgres.<project-ref>" — a bare
  # "postgres" fails authentication at the pooler.
  PGUSER: postgres.llmxwvclxiiwczcnbsrt

jobs:
  backup:
    # Postgres 17 client: pg_dump must be >= the server version, and Supabase
    # runs Postgres 17. The ubuntu-latest default client (16) aborts with
    # "server version mismatch". The postgres:17 image ships the matching
    # pg_dump plus gzip.
    runs-on: ubuntu-latest
    container: postgres:17
    steps:
      - name: Dump database
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          if [ -z "$PGPASSWORD" ]; then
            echo "::error::SUPABASE_DB_PASSWORD secret is not set. See comments at the top of this file."
            exit 1
          fi
          pg_dump --version
          pg_dump \
            --no-owner \
            --no-privileges \
            --exclude-schema='^pg_*' \
            --format=custom \
            --file=findbackph-db.dump \
            "$PGDATABASE"
          gzip -9 findbackph-db.dump
          ls -lh findbackph-db.dump.gz

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_id }}
          path: findbackph-db.dump.gz
          retention-days: 30
          if-no-files-found: error

